<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Today's Celebrations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/dashboard">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Today's Celebrations</li>
        </ol>
    </nav>
    <h1 class="mb-4">Today's Celebrations (<span th:text="${#temporals.format(today, 'dd-MM-yyyy')}"></span>)</h1>
    <div class="card mb-4">
        <div class="card-body">
            <h4 class="card-title">Birthdays</h4>
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Category</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${birthdayUsers.empty}">
                    <td colspan="4" class="text-center">No Birthdays Today</td>
                </tr>
                <tr th:each="user : ${birthdayUsers}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.name}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.category}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="card">
        <div class="card-body">
            <h4 class="card-title">Anniversaries</h4>
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Category</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${anniversaryUsers.empty}">
                    <td colspan="4" class="text-center">No Anniversaries Today</td>
                </tr>
                <tr th:each="user : ${anniversaryUsers}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.name}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.category}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <a href="/dashboard" class="btn btn-secondary mt-4">Back to Dashboard</a>
</div>
</body>
</html>
