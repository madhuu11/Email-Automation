<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Templates - Email Automation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/dashboard">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">All Templates</li>
        </ol>
    </nav>

    <h1 class="mb-4">All Templates</h1>

    <div class="mb-3">
        <a href="/email-template/addEmailTemplate" class="btn btn-success">+ Add New Template</a>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Template Name</th>
            <th>Subject</th>
            <th>Body</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${templates.empty}">
            <td colspan="5" class="text-center">No templates Available</td>
        </tr>
        <tr th:each="template : ${templates}">
            <td th:text="${template.id}"></td>
            <td th:text="${template.templateName}"></td>
            <td th:text="${template.subject}"></td>
            <td th:text="${template.body}"></td>
            <td>
                <a th:href="@{'/email-template/delete-template/' + ${template.id}}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this template?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
