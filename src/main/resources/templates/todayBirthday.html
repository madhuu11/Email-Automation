<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Today's Birthdays - Birthday Email Automation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/dashboard">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Today's Birthdays</li>
        </ol>
    </nav>

    <h1 class="mb-4">Today's Birthdays <span class="badge bg-info" th:text="${#temporals.format(today, 'dd MMM yyyy')}"></span></h1>

    <div class="mb-3">
        <a href="/birthday-email/send" class="btn btn-warning">Send Birthday Emails</a>
        <a href="/birthday-email/add-user" class="btn btn-success ms-2">+ Add New User</a>
    </div>

    <div class="alert alert-info" th:if="${users.empty}">
        <h4 class="alert-heading">No Birthdays Today!</h4>
        <p>There are no users with birthdays on today's date.</p>
    </div>

    <div class="row" th:if="${!users.empty}">
        <div class="col-md-4 mb-4" th:each="user : ${users}">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Birthday Today! 🎂</h5>
                </div>
                <div class="card-body">
                    <h5 class="card-title" th:text="${user.name}"></h5>
                    <p class="card-text">
                        <strong>Email:</strong> <span th:text="${user.email}"></span><br>
                        <strong>Date of Birth:</strong> <span th:text="${#temporals.format(user.dateOfBirth, 'dd MMMM yyyy')}"></span><br>
                        <span class="badge bg-success">Happy Birthday!</span>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
