<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Events</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1 class="mb-4">All Events</h1>
    <a href="/events/add" class="btn btn-success mb-3">+ Add New Event</a>
    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Location</th>
            <th>Template ID</th>
            <th>Category</th>
            <th>Email Sent</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${events.empty}">
            <td colspan="8" class="text-center">No Events Available</td>
        </tr>
        <tr th:each="event : ${events}">
            <td th:text="${event.id}"></td>
            <td th:text="${event.title}"></td>
            <td th:text="${event.description}"></td>
            <td th:text="${event.location}"></td>
            <td th:text="${event.template_id}"></td>
            <td th:text="${event.category}"></td>
            <td th:text="${event.emailSent} ? 'Yes' : 'No'"></td>
            <td>
                <a th:href="@{'/events/edit/' + ${event.id}}" class="btn btn-primary btn-sm">Edit</a>
                <a th:href="@{'/events/delete/' + ${event.id}}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this event?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a href="/dashboard" class="btn btn-secondary mt-3">Back to Dashboard</a>
</div>
</body>
</html>
