<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Event</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1 class="mb-4">Add New Event</h1>
    <form th:action="@{/events/add}" th:object="${event}" method="post">
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" th:field="*{title}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" th:field="*{description}"></textarea>
        </div>
        <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <input type="text" class="form-control" id="location" th:field="*{location}">
        </div>
        <div class="mb-3">
            <label for="template_id" class="form-label">Template ID</label>
            <input type="number" class="form-control" id="template_id" th:field="*{template_id}">
        </div>
        <div class="mb-3">
            <label for="category" class="form-label">Category</label>
            <select class="form-select" id="category" th:field="*{category}" required>
                <option value="" disabled selected>Select category</option>
                <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="emailSent" class="form-label">Email Sent</label>
            <select class="form-select" id="emailSent" th:field="*{emailSent}">
                <option th:value="false">No</option>
                <option th:value="true">Yes</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Add Event</button>
        <a href="/events" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
