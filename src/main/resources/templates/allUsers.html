<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Users - Birthday Email Automation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/dashboard">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">All Users</li>
        </ol>
    </nav>

    <h1 class="mb-4">All Users</h1>

    <div class="mb-3">
        <a href="/birthday-email/add-user" class="btn btn-success">+ Add New User</a>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Birthday</th>
            <th>Anniversary</th>
            <th>Category</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${users.empty}">
            <td colspan="7" class="text-center">No Users Available</td>
        </tr>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.name}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${#temporals.format(user.dateOfBirth, 'dd-MM-yyyy')}"></td>
            <td th:text="${user.anniversary != null ? #temporals.format(user.anniversary, 'dd-MM-yyyy') : '-'}"></td>
            <td th:text="${user.category}"></td>
            <td>
                <a th:href="@{'/birthday-email/edit-user/' + ${user.id}}" class="btn btn-primary btn-sm me-1">Edit</a>
                <a th:href="@{'/birthday-email/delete-user/' + ${user.id}}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this user?');">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
